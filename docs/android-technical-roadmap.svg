<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffaf3"/>
      <stop offset="0.56" stop-color="#fff6ec"/>
      <stop offset="1" stop-color="#ffe7d2"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#f25a18"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#5e3f27" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L11 7L2 12" stroke="#f25a18" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
