    <rect x="34" y="34" width="292" height="66" rx="24" fill="#001f33"/>
    <text x="180" y="77" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="800" font-family="Microsoft YaHei, sans-serif">数据与媒体层</text>
    <text x="44" y="152" fill="#f25a18" font-size="24" font-weight="800" font-family="Microsoft YaHei, sans-serif">SQLite 数据库</text>
    <text x="44" y="192" fill="#001f33" font-size="22" font-weight="700" font-family="Microsoft YaHei, sans-serif">结构化菜谱存储</text>
    <text x="44" y="228" fill="#6f5a4b" font-size="19" font-family="Microsoft YaHei, sans-serif">菜谱 / 食材 / 步骤</text>
    <text x="44" y="258" fill="#6f5a4b" font-size="19" font-family="Microsoft YaHei, sans-serif">补救建议 / 历史记录</text>
    <rect x="44" y="310" width="272" height="104" rx="20" fill="#fff4e8" stroke="#ffd2ad"/>
    <text x="180" y="343" text-anchor="middle" fill="#001f33" font-size="20" font-weight="800" font-family="Microsoft YaHei, sans-serif">视频 / 文章解析</text>
    <text x="180" y="374" text-anchor="middle" fill="#7a5334" font-size="17" font-family="Microsoft YaHei, sans-serif">yt-dlp 元信息抓取</text>
    <text x="180" y="402" text-anchor="middle" fill="#7a5334" font-size="17" font-family="Microsoft YaHei, sans-serif">字幕解析 / Whisper 转写</text>
    <rect x="44" y="448" width="272" height="92" rx="20" fill="#f8fffa" stroke="#cdebd5"/>
    <text x="180" y="481" text-anchor="middle" fill="#0f7a3b" font-size="20" font-weight="800" font-family="Microsoft YaHei, sans-serif">可靠时间轴</text>
    <text x="180" y="512" text-anchor="middle" fill="#4f6a55" font-size="17" font-family="Microsoft YaHei, sans-serif">字幕/章节匹配步骤片段</text>
  </g>

  <g transform="translate(1444, 228)">
