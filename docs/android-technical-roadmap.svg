    <rect x="34" y="34" width="292" height="66" rx="24" fill="#001f33"/>
    <text x="180" y="77" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="800" font-family="Microsoft YaHei, sans-serif">Android 应用层</text>
    <text x="44" y="152" fill="#f25a18" font-size="24" font-weight="800" font-family="Microsoft YaHei, sans-serif">React + Vite</text>
    <text x="44" y="192" fill="#001f33" font-size="22" font-weight="700" font-family="Microsoft YaHei, sans-serif">移动端界面</text>
    <text x="44" y="228" fill="#6f5a4b" font-size="19" font-family="Microsoft YaHei, sans-serif">首页 / 搜索 / 详情 / 导入</text>
    <text x="44" y="258" fill="#6f5a4b" font-size="19" font-family="Microsoft YaHei, sans-serif">跟做模式 / 完成记录</text>
