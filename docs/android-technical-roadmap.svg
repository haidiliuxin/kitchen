  <rect width="1920" height="1080" rx="0" fill="url(#bg)"/>
  <circle cx="1784" cy="80" r="150" fill="#001f33"/>
  <circle cx="72" cy="1014" r="150" fill="#001f33"/>

  <text x="110" y="118" fill="#001f33" font-size="58" font-weight="800" font-family="Microsoft YaHei, PingFang SC, sans-serif">小白下厨 Android 应用技术路线图</text>
  <text x="112" y="168" fill="#7a5334" font-size="25" font-weight="600" font-family="Microsoft YaHei, PingFang SC, sans-serif">从多源内容输入，到 AI 结构化理解，再到厨房跟做闭环</text>

  <g transform="translate(118, 228)">
