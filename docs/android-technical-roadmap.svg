    <text x="180" y="337" text-anchor="middle" fill="#001f33" font-size="20" font-weight="800" font-family="Microsoft YaHei, sans-serif">Capacitor APK</text>
    <text x="180" y="366" text-anchor="middle" fill="#7a5334" font-size="17" font-family="Microsoft YaHei, sans-serif">Web 能力封装为安卓应用</text>
    <rect x="44" y="416" width="272" height="104" rx="20" fill="#f8fffa" stroke="#cdebd5"/>
    <text x="180" y="449" text-anchor="middle" fill="#0f7a3b" font-size="20" font-weight="800" font-family="Microsoft YaHei, sans-serif">原生能力接入</text>
    <text x="180" y="480" text-anchor="middle" fill="#4f6a55" font-size="17" font-family="Microsoft YaHei, sans-serif">麦克风权限 / 语音识别</text>
    <text x="180" y="508" text-anchor="middle" fill="#4f6a55" font-size="17" font-family="Microsoft YaHei, sans-serif">TTS 朗读 / 返回键处理</text>
