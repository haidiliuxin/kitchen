    <rect x="34" y="34" width="292" height="66" rx="24" fill="url(#orange)"/>
    <text x="180" y="77" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="800" font-family="Microsoft YaHei, sans-serif">大模型能力层</text>
    <text x="44" y="152" fill="#f25a18" font-size="24" font-weight="800" font-family="Microsoft YaHei, sans-serif">DeepSeek / LLM</text>
    <text x="44" y="192" fill="#001f33" font-size="22" font-weight="700" font-family="Microsoft YaHei, sans-serif">内容理解与生成</text>
    <text x="44" y="228" fill="#6f5a4b" font-size="19" font-family="Microsoft YaHei, sans-serif">视频/文章 → 结构化菜谱</text>
    <text x="44" y="258" fill="#6f5a4b" font-size="19" font-family="Microsoft YaHei, sans-serif">食材、步骤、提醒、风险点</text>
    <rect x="44" y="312" width="272" height="104" rx="20" fill="#fff4e8" stroke="#ffd2ad"/>
    <text x="180" y="345" text-anchor="middle" fill="#001f33" font-size="20" font-weight="800" font-family="Microsoft YaHei, sans-serif">AI 厨房教练</text>
    <text x="180" y="376" text-anchor="middle" fill="#7a5334" font-size="17" font-family="Microsoft YaHei, sans-serif">结合当前菜谱与步骤</text>
    <text x="180" y="404" text-anchor="middle" fill="#7a5334" font-size="17" font-family="Microsoft YaHei, sans-serif">回答问题 / 解释 / 补救</text>
    <rect x="44" y="450" width="272" height="84" rx="20" fill="#f8fffa" stroke="#cdebd5"/>
    <text x="180" y="482" text-anchor="middle" fill="#0f7a3b" font-size="20" font-weight="800" font-family="Microsoft YaHei, sans-serif">Agent 化辅助</text>
    <text x="180" y="512" text-anchor="middle" fill="#4f6a55" font-size="17" font-family="Microsoft YaHei, sans-serif">采购清单 / 备菜顺序 / 推荐</text>
  </g>

  <path d="M500 538H540" stroke="#f25a18" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M942 538H982" stroke="#f25a18" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1384 538H1424" stroke="#f25a18" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(210, 910)">
    <rect x="0" y="0" width="1500" height="88" rx="30" fill="#001f33"/>
    <text x="750" y="36" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800" font-family="Microsoft YaHei, sans-serif">产品闭环</text>
    <text x="750" y="68" text-anchor="middle" fill="#fff4e8" font-size="22" font-weight="700" font-family="Microsoft YaHei, sans-serif">选菜 / 导入 → AI 生成攻略 → 分步骤跟做 → 语音提问与控制 → 完成记录 → 推荐下一道菜</text>
  </g>

  <g transform="translate(122, 44)">
    <circle cx="0" cy="0" r="0"/>
  </g>
  <text x="110" y="1024" fill="#001f33" font-size="22" font-weight="800" font-family="Microsoft YaHei, sans-serif">小白下厨</text>
  <text x="1720" y="1024" fill="#001f33" font-size="22" font-weight="800" font-family="Microsoft YaHei, sans-serif">Android Demo</text>
</svg>
