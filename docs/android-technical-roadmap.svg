    <text x="180" y="485" text-anchor="middle" fill="#0f7a3b" font-size="20" font-weight="800" font-family="Microsoft YaHei, sans-serif">状态编排</text>
    <text x="180" y="513" text-anchor="middle" fill="#4f6a55" font-size="17" font-family="Microsoft YaHei, sans-serif">跟做步骤、计时与语音命令</text>
  </g>

  <g transform="translate(1002, 228)">
